name: Deploy Smart Green Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          rm -rf _site && mkdir -p _site
          for f in index.html app.js app.css tw-lite.css; do
            [ -f "$f" ] && cp "$f" _site/
          done
          cp _site/index.html _site/404.html
          printf '%s\n' "Smart Green investor demo" > _site/VERSION.txt
          date -u +%Y-%m-%dT%H:%M:%SZ >> _site/VERSION.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
