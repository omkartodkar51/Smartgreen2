<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Green · तुमचं हिरवं, स्मार्ट घर</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tw-lite.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body class="bg-[#f4fbf4] text-[#111111] antialiased">
  <main id="main" class="min-h-screen max-w-md mx-auto relative bg-[#f4fbf4] shadow-2xl overflow-hidden flex flex-col">
    <div id="screens" class="flex-1 flex flex-col"></div>
    <div id="loader" class="absolute inset-0 bg-black/40 backdrop-blur-xs z-50 grid place-items-center" hidden>
      <div class="w-12 h-12 rounded-2xl bg-[#f8cb2e] border-2 border-black animate-bounce grid place-items-center shadow-[4px_4px_0px_#000]">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
      </div>
    </div>
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-2xl bg-black text-[#f8cb2e] font-extrabold text-xs shadow-2xl border-2 border-[#f8cb2e] tracking-wider uppercase" hidden></div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
